name: Task per agente
description: Attività per un agente, collegata a requisiti, casi d’uso, modelli e test.
title: "[TASK] "
labels: ["task-agente"]
body:
  - type: input
    id: riferimenti
    attributes:
      label: ID requisito o caso d’uso
      description: Usa ID reali del RAD; per setup o documentazione indica N/A e il motivo.
    validations:
      required: true
  - type: textarea
    id: obiettivo
    attributes:
      label: Descrizione e obiettivo
      description: Descrivi il risultato richiesto e l’ambito della modifica.
    validations:
      required: true
  - type: textarea
    id: modelli
    attributes:
      label: Riferimenti ai modelli
      description: File o link, sezioni, versioni e stato di approvazione di RAD, SDD e diagrammi pertinenti; dichiara ciò che manca.
    validations:
      required: true
  - type: textarea
    id: ambito
    attributes:
      label: Ambito (classi, metodi e file da modificare)
      description: Indica l’ambito previsto; se non ancora definito, richiedine l’analisi nel piano.
    validations:
      required: true
  - type: textarea
    id: accettazione
    attributes:
      label: Criteri di accettazione
      description: Risultati osservabili dalla specifica, inclusi errori e alternative pertinenti.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Test previsti
      description: Test Frame e fonte degli esiti attesi; per attività documentali indica le verifiche previste.
    validations:
      required: true
  - type: textarea
    id: dipendenze
    attributes:
      label: Dipendenze
      description: Issue prerequisite, impedimenti e decisioni pendenti; scrivi Nessuna se assenti.
    validations:
      required: true
