name: Task agentico Raduna
description: Avvio controllato di un task Raduna con piano e approvazione del TM.
title: "[Raduna] "
labels: [task-agente]
body:
  - type: markdown
    attributes:
      value: |
        La Issue raccoglie piano, approvazione del TM, Draft PR, revisione, test e stato CI.
        Non inserire segreti o dati personali. Una label non approva il piano.
  - type: input
    id: usecase
    attributes:
      label: Comportamento richiesto
      description: Descrivi un comportamento circoscritto; aggiungi ID RAD o caso d'uso quando disponibili.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Fonti disponibili
      description: Indica requisiti, modelli e versioni disponibili; segnala le fonti mancanti che possono influire sul task.
    validations:
      required: false
  - type: textarea
    id: frames
    attributes:
      label: Test frame disponibili
      description: Indica frame, input ed esiti disponibili; se assenti, descrivi i casi da verificare nei criteri di accettazione.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Obiettivo e criteri di accettazione
      description: Flusso principale, eccezioni, controlli e limiti proposti di tempo e tentativi.
    validations:
      required: true
  - type: input
    id: tm
    attributes:
      label: TM responsabile
      description: Assegna il TM anche nel campo Assignees. Dopo aver verificato il piano, il TM aggiunge fase:implementazione per avviare l'agente.
    validations:
      required: true
