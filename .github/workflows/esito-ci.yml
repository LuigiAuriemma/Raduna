name: Aggiorna CI nella Issue
on:
  workflow_run:
    workflows: [Raduna CI]
    types: [completed]
permissions: {}
jobs:
  rapporto:
    if: github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'raduna/issue-') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency: raduna-esito-${{ github.event.workflow_run.head_branch }}
    permissions: {actions: read, contents: read, issues: write, pull-requests: read, statuses: write}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/agentic/delivery/ci-report')({github, context, core})
